<div id="design-studio" data-step="1">
  <header class="wizard-header"><nav class="studio-steps" aria-label="设计步骤"><button type="button" data-step="1" aria-current="step"><span>1</span>选择预设</button><i aria-hidden="true"></i><button type="button" data-step="2"><span>2</span>预览微调</button><i aria-hidden="true"></i><button type="button" data-step="3"><span>3</span>导出</button></nav><span id="storage-status" role="status">正在读取…</span></header>
  <div id="studio-message" class="studio-message" role="status" hidden></div>
  <section id="step-one" class="wizard-panel" data-step-panel="1" aria-labelledby="step-1-title"><div class="panel-heading"><h2 id="step-1-title" tabindex="-1">选择一个起点</h2><select id="collection-filter" aria-label="筛选设计方向"><option value="all">全部方向</option><option value="expressive">视觉表达</option><option value="spatial">空间探索</option><option value="functional">产品应用</option><option value="mobile">移动体验</option><option value="user">我的预设</option></select></div><div class="step-scroll" id="preset-scroll"><div id="design-collection" class="design-collection" aria-label="设计预设"></div></div></section>
  <section id="step-two" class="wizard-panel" data-step-panel="2" aria-labelledby="step-2-title" hidden><div class="panel-heading"><h2 id="step-2-title" tabindex="-1">预览微调 <span id="selected-direction"></span></h2><div class="preview-controls"><label>画幅<select id="viewport" aria-label="预览画幅"><option value="desktop">桌面</option><option value="tablet">平板</option><option value="mobile">手机</option></select></label><button type="button" id="replay-motion">重播</button><button type="button" id="toggle-editor" aria-pressed="false">微调</button><button type="button" id="maximize-preview" aria-pressed="false">放大预览</button></div></div>
    <div class="studio-columns"><section class="studio-preview-area" aria-label="布局预览"><div id="preview-container"><div id="studio-export"></div></div><div class="preview-caption"><span id="preview-summary"></span><span id="preview-info" role="status"></span><span id="preview-title" hidden></span></div></section>
    <aside class="editor-sidebar" aria-label="微调面板"><div class="editor-tabs" role="tablist" aria-label="微调分类"><button type="button" role="tab" data-editor-tab="layout" aria-selected="true" aria-controls="library-panel">布局与效果</button><button type="button" role="tab" data-editor-tab="parameters" aria-selected="false" aria-controls="inspector-panel">参数</button></div><div id="editor-scroll"><div id="library-panel" role="tabpanel"><div class="studio-library" aria-label="效果库"><span id="effect-count" hidden></span><div id="library-content"></div></div></div><div id="inspector-panel" role="tabpanel" hidden><aside class="studio-inspector" aria-label="设计参数"><div class="section-heading"><h2>参数</h2><span>当前组合</span></div>
      <label>应用名称<input id="project-title" maxlength="48"/></label><label>用途说明<textarea id="project-purpose" rows="2" maxlength="160"></textarea></label>
      <label>目标平台<select id="target-platform"><option value="web">网页 / Web</option><option value="android">Android</option><option value="desktop">桌面应用</option></select></label><label>画布编排<select id="canvas-mode"><option value="mosaic">大小磁贴拼贴</option><option value="scatter">散点灵感板</option></select></label>
      <div class="inspector-pair"><label>列数<select id="columns"><option value="2">2 列</option><option value="3">3 列</option><option value="4">4 列</option></select></label><label>密度<select id="density"><option value="comfortable">宽松</option><option value="compact">紧凑</option></select></label></div>
      <label>圆角 <output id="radius-value"></output><input id="radius" type="range" min="0" max="24" step="2"/></label><label>间距 <output id="gap-value"></output><input id="gap" type="range" min="2" max="28" step="2"/></label>
      <div class="inspector-pair"><label>强调色<input id="accent" type="color"/></label><label>动效时长<select id="duration"><option value="0">关闭动效</option><option value="160">160 ms</option><option value="240">240 ms</option><option value="360">360 ms</option><option value="480">480 ms</option></select></label></div>
      <label>示例数据<select id="data-size"><option value="12">12 条</option><option value="100">100 条</option><option value="10000">10,000 条（虚拟列表）</option></select></label>
      <label class="inspector-switch"><input id="dark-preview" type="checkbox"/>深色预览</label>
      <section class="studio-modules"><h3>页面模块顺序</h3><div id="module-order"></div></section>
    </aside></div></div></aside></div>
    <div class="preset-save"><input id="preset-name" aria-label="新预设名称" placeholder="预设名称…" maxlength="40"/><button type="button" id="save-preset">保存预设</button><button type="button" id="delete-preset" hidden>删除此预设</button></div>
  </section>
  <section id="step-three" class="wizard-panel" data-step-panel="3" aria-labelledby="step-3-title" hidden><div class="panel-heading"><h2 id="step-3-title" tabindex="-1">导出设计</h2></div><section class="studio-output" aria-label="设计输出"><div class="output-heading"><div class="output-tabs" role="tablist" aria-label="输出格式"><button type="button" role="tab" aria-selected="true" id="output-json" data-output="json" aria-controls="output-text">配置 JSON</button><button type="button" role="tab" aria-selected="false" id="output-html" data-output="html" aria-controls="output-text">可运行 HTML 示例</button><button type="button" role="tab" aria-selected="false" id="output-agent" data-output="agent" aria-controls="output-text">Agent 设计说明</button><button type="button" role="tab" aria-selected="false" id="output-sources" data-output="sources" aria-controls="output-text">参考与边界</button></div><div class="output-actions"><button type="button" id="import-config">粘贴导入配置</button><button type="button" id="copy-output" class="studio-primary">复制当前内容</button></div></div><label for="output-text" id="output-label">当前组合的配置代码</label><textarea id="output-text" readonly spellcheck="false" aria-label="当前设计输出"></textarea><p id="output-note"></p></section></section>
  <footer class="wizard-footer"><span id="step-position">1 / 3</span><div><button type="button" id="step-back" hidden>← 上一步</button><button type="button" id="step-next" class="studio-primary" disabled>下一步：预览微调 →</button></div></footer>
<section id="import-panel" class="studio-dialog-overlay" hidden><div class="studio-dialog" role="dialog" aria-modal="true" aria-labelledby="import-title"><h2 id="import-title">导入设计配置</h2><p>粘贴设计台导出的 JSON，仅解析配置，不执行 HTML 或脚本。</p><textarea id="import-text" spellcheck="false" aria-label="待导入设计 JSON"></textarea><p id="import-error" role="alert"></p><div><button type="button" id="cancel-import">取消</button><button type="button" id="confirm-import" class="studio-primary">校验并应用</button></div></div></section>
</div>
