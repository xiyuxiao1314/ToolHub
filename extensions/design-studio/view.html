<div id="design-studio">
  <header class="studio-heading"><div><span class="studio-eyebrow">DESIGN STUDIO / 组合你的下一款应用</span><h1>先看见，再创造。</h1></div><span class="studio-version">本机设计台 · v0.2</span></header>
  <section class="studio-collection" aria-label="精选设计方向"><div class="collection-heading"><div><span class="studio-eyebrow">CURATED DIRECTIONS / 12 个起点</span><h2>找到你的视觉语言。</h2></div><label>筛选方向<select id="collection-filter" aria-label="筛选设计方向"><option value="all">全部方向</option><option value="expressive">视觉表达</option><option value="spatial">空间探索</option><option value="functional">产品应用</option><option value="mobile">移动体验</option></select></label></div><div id="design-collection" class="design-collection"></div><div id="direction-detail" class="direction-detail" hidden></div></section>
  <section class="preset-bar" aria-label="预设管理"><label>从预设开始<select id="preset-select" aria-label="选择设计预设"></select></label><button type="button" id="apply-preset">应用预设</button><span class="preset-divider"></span><input id="preset-name" aria-label="新预设名称" placeholder="为当前组合命名…" maxlength="40"/><button type="button" id="save-preset" class="studio-primary">保存为预设</button><button type="button" id="delete-preset">删除自定义预设</button><span id="storage-status" role="status">正在读取预设…</span></section>
  <div id="studio-message" class="studio-message" role="status" hidden></div>
  <div class="studio-columns">
    <aside class="studio-library" aria-label="效果库"><div class="section-heading"><h2>效果库</h2><span id="effect-count"></span></div><div id="library-content"></div></aside>
    <section class="studio-preview-area" aria-label="布局预览"><div class="preview-heading"><div><span class="studio-eyebrow">LIVE PREVIEW</span><h2 id="preview-title">实时预览</h2></div><div class="preview-controls"><label>画幅<select id="viewport" aria-label="预览画幅"><option value="desktop">桌面</option><option value="tablet">平板</option><option value="mobile">手机</option></select></label><button type="button" id="replay-motion">重播动效</button><button type="button" id="maximize-preview" aria-pressed="false">放大预览</button></div></div><div id="preview-container"><div id="studio-export"></div></div><div class="preview-caption"><span id="preview-summary"></span><span id="preview-info" role="status">点击卡片或操作导航，试用当前组合</span></div><div id="combination-notes" class="combination-notes" hidden></div></section>
    <aside class="studio-inspector" aria-label="设计参数"><div class="section-heading"><h2>参数</h2><span>当前组合</span></div>
      <label>应用名称<input id="project-title" maxlength="48"/></label><label>用途说明<textarea id="project-purpose" rows="2" maxlength="160"></textarea></label>
      <label>目标平台<select id="target-platform"><option value="web">网页 / Web</option><option value="android">Android</option><option value="desktop">桌面应用</option></select></label><label>画布编排<select id="canvas-mode"><option value="mosaic">大小磁贴拼贴</option><option value="scatter">散点灵感板</option></select></label>
      <div class="inspector-pair"><label>列数<select id="columns"><option value="2">2 列</option><option value="3">3 列</option><option value="4">4 列</option></select></label><label>密度<select id="density"><option value="comfortable">宽松</option><option value="compact">紧凑</option></select></label></div>
      <label>圆角 <output id="radius-value"></output><input id="radius" type="range" min="0" max="24" step="2"/></label><label>间距 <output id="gap-value"></output><input id="gap" type="range" min="2" max="28" step="2"/></label>
      <div class="inspector-pair"><label>强调色<input id="accent" type="color"/></label><label>动效时长<select id="duration"><option value="0">关闭动效</option><option value="160">160 ms</option><option value="240">240 ms</option><option value="360">360 ms</option><option value="480">480 ms</option></select></label></div>
      <label>示例数据<select id="data-size"><option value="12">12 条</option><option value="100">100 条</option><option value="10000">10,000 条（虚拟列表）</option></select></label>
      <label class="inspector-switch"><input id="dark-preview" type="checkbox"/>深色预览</label>
      <section class="studio-modules"><h3>页面模块顺序</h3><div id="module-order"></div></section>
    </aside>
  </div>
  <section class="studio-output" aria-label="设计输出"><div class="output-heading"><div class="output-tabs" role="tablist" aria-label="输出格式"><button type="button" role="tab" aria-selected="true" id="output-json" data-output="json" aria-controls="output-text">配置 JSON</button><button type="button" role="tab" aria-selected="false" id="output-html" data-output="html" aria-controls="output-text">可运行 HTML 示例</button><button type="button" role="tab" aria-selected="false" id="output-agent" data-output="agent" aria-controls="output-text">Agent 设计说明</button><button type="button" role="tab" aria-selected="false" id="output-sources" data-output="sources" aria-controls="output-text">参考与边界</button></div><div class="output-actions"><button type="button" id="import-config">粘贴导入配置</button><button type="button" id="copy-output" class="studio-primary">复制当前内容</button></div></div><label for="output-text" id="output-label">当前组合的配置代码</label><textarea id="output-text" readonly spellcheck="false" aria-label="当前设计输出"></textarea><p id="output-note"></p></section>
  <section id="import-panel" class="studio-dialog-overlay" hidden><div class="studio-dialog" role="dialog" aria-modal="true" aria-labelledby="import-title"><h2 id="import-title">导入设计配置</h2><p>粘贴设计台导出的 JSON，仅解析配置，不执行 HTML 或脚本。</p><textarea id="import-text" spellcheck="false" aria-label="待导入设计 JSON"></textarea><p id="import-error" role="alert"></p><div><button type="button" id="cancel-import">取消</button><button type="button" id="confirm-import" class="studio-primary">校验并应用</button></div></div></section>
</div>
