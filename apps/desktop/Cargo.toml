[package]
name = "toolhub-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ToolHub Desktop (Tauri/React/TypeScript)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

serde = { workspace = true }
serde_json = { workspace = true }
toolhub-ipc = { workspace = true }
toolhub-protocol = { workspace = true }

[[bin]]
name = "toolhub-desktop"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
